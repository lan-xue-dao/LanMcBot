# 每次 push 到 main 自动构建单文件 lanmcbot.exe 并上传 artifact。
# 产物在 Actions 页面对应 run 的 Artifacts 区下载（lanmcbot.exe）。
# 验证门槛：npm test 全绿 + exe 能启动打印 banner（--timeout 冒烟）才算构建成功。

name: build-exe

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test (must pass before packaging)
        shell: pwsh
        run: |
          # 三重门槛，缺一不可：
          #   1) exit code 为 0（真的没失败用例）
          #   2) 有 passing 计数（mocha 在 0 用例/glob 失效时也返回 0 → 防假绿）
          #   3) 通过数 >= 250（防止用例被静默跳过）
          # 注意：`2>&1 | Out-String` 会覆盖 $LASTEXITCODE，所以先取码再处理输出。
          $out = & npm test 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 0) { throw "npm test failed (exit $code)" }
          if ($out -notmatch '(\d+) passing') { throw 'npm test produced no passing count' }
          $passed = [int]$Matches[1]
          if ($out -match '(\d+) failing') { throw "npm test reported $($Matches[1]) failing" }
          if ($passed -lt 250) { throw "only $passed tests passed, expected >= 250" }
          Write-Host "tests passed: $passed"

      - name: Build single-file exe
        run: npm run build:exe

      - name: Smoke the exe (starts, prints banner, exits cleanly)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\dist\lanmcbot.exe -NoNewWindow -PassThru `
                 -RedirectStandardOutput smoke-out.txt -RedirectStandardError smoke-err.txt
          Start-Sleep -Seconds 20
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          $out = Get-Content smoke-out.txt -Raw
          if ($out -notmatch 'LanMcBot 启动成功') { Write-Host $out; Write-Host (Get-Content smoke-err.txt -Raw); throw 'exe smoke failed: banner not printed' }
          Write-Host 'exe smoke passed'

      - name: Compress artifact (exe 59MB → zip ~20MB，下载更快)
        shell: pwsh
        run: Compress-Archive -Path dist/lanmcbot.exe -DestinationPath dist/lanmcbot-windows-x64.zip -CompressionLevel Optimal

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lanmcbot-windows-x64
          path: dist/lanmcbot-windows-x64.zip
          if-no-files-found: error
